<div class="app-container">
  <!-- Header -->
  <header class="app-header">
    <div class="header-content">
      <h1 class="app-title">
        <span class="title-icon">💰</span>
        {{ title }}
      </h1>
      <p class="app-subtitle">Smart Budget Management with AI-Powered Insights</p>
    </div>
  </header>

  <!-- Navigation -->
  <nav class="app-nav">
    <button 
      class="nav-btn"
      [class.active]="activeTab === 'dashboard'"
      (click)="setActiveTab('dashboard')">
      <span class="nav-icon">📊</span>
      <span class="nav-label">Dashboard</span>
    </button>
    <button 
      class="nav-btn"
      [class.active]="activeTab === 'expenses'"
      (click)="setActiveTab('expenses')">
      <span class="nav-icon">💸</span>
      <span class="nav-label">Expenses</span>
    </button>
    <button 
      class="nav-btn"
      [class.active]="activeTab === 'chatbot'"
      (click)="setActiveTab('chatbot')">
      <span class="nav-icon">🤖</span>
      <span class="nav-label">AI Assistant</span>
    </button>
  </nav>

  <!-- Main Content -->
  <main class="app-main">
    <!-- Dashboard Tab -->
    <div *ngIf="activeTab === 'dashboard'" class="tab-content">
      <app-dashboard></app-dashboard>
    </div>

    <!-- Expenses Tab -->
    <div *ngIf="activeTab === 'expenses'" class="tab-content">
      <div class="expenses-layout">
        <div class="expense-form-section">
          <app-expense-form></app-expense-form>
        </div>
        <div class="expense-list-section">
          <app-expense-list></app-expense-list>
        </div>
      </div>
    </div>

    <!-- AI Chatbot Tab -->
    <div *ngIf="activeTab === 'chatbot'" class="tab-content">
      <app-chatbot></app-chatbot>
    </div>
  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <p>© 2025 AI Finance Tracker • Track smarter, save better 🚀</p>
  </footer>
</div>

<router-outlet />
