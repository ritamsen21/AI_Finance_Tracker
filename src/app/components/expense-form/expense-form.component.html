<div class="expense-form-container">
  <h2>Add New Expense</h2>
  <form (ngSubmit)="onSubmit()" class="expense-form">
    <div class="form-group">
      <label for="amount">Amount (₹)</label>
      <input
        type="number"
        id="amount"
        [(ngModel)]="amount"
        name="amount"
        min="0"
        step="1"
        placeholder="0"
        required
      />
    </div>

    <div class="form-group">
      <label for="category">Category</label>
      <select
        id="category"
        [(ngModel)]="category"
        name="category"
        required
      >
        <option value="">Select a category</option>
        <option *ngFor="let cat of categories" [value]="cat.name">
          {{ cat.icon }} {{ cat.name }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <input
        type="text"
        id="description"
        [(ngModel)]="description"
        name="description"
        placeholder="What did you spend on?"
        required
      />
    </div>

    <div class="form-group">
      <label for="date">Date</label>
      <input
        type="date"
        id="date"
        [(ngModel)]="date"
        name="date"
        required
      />
    </div>

    <div class="form-group checkbox-group">
      <label>
        <input
          type="checkbox"
          [(ngModel)]="isRecurring"
          name="isRecurring"
        />
        <span>Recurring expense</span>
      </label>
    </div>

    <button type="submit" class="submit-btn" [disabled]="amount <= 0 || !category || !description">
      Add Expense
    </button>
  </form>
</div>
